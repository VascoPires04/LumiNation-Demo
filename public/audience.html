<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07070c">
  <title>LumiNation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #07070c;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* ── GPS overlay ─────────────────────────────────────────────── */
    #gps-overlay {
      position: fixed;
      inset: 0;
      background: #07070c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }
    #gps-overlay.gone { display: none; }

    .gps-spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(250,199,117,0.15);
      border-top-color: #FAC775;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .gps-status {
      font-size: 0.85rem;
      color: rgba(245,245,248,0.4);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
      padding: 0 24px;
    }

    /* ── Gradient background layer ────────────────────────────────── */
    #bg {
      position: fixed;
      inset: 0;
      background: #07070c;
      /* Updated by JS each RAF frame */
    }

    /* ── Content layer ────────────────────────────────────────────── */
    #content {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .wordmark {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(250,199,117,0.35);
      animation: breathe 3.5s ease-in-out infinite;
      transition: color 0.4s ease;
    }
    .wordmark span { color: rgba(250,199,117,0.6); transition: color 0.4s ease; }

    /* Switch to dark when screen is bright */
    body.lit .wordmark       { color: rgba(60,40,5,0.7); animation: none; }
    body.lit .wordmark span  { color: rgba(60,40,5,0.9); }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 1;   }
    }

    .sub-text {
      margin-top: 14px;
      font-size: 0.8rem;
      color: rgba(245,245,248,0.25);
      letter-spacing: 0.04em;
      text-align: center;
      transition: color 0.4s ease;
    }
    body.lit .sub-text { color: rgba(60,40,5,0.5); }

    /* ── Lamp count (bottom) ──────────────────────────────────────── */
    #lamp-count {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(245,245,248,0.2);
      letter-spacing: 0.05em;
      white-space: nowrap;
      z-index: 10;
      transition: color 0.4s ease;
    }
    body.lit #lamp-count { color: rgba(60,40,5,0.35); }

    /* ── Stopped messages ─────────────────────────────────────────── */
    #msg1, #msg2 {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 36px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 20;
    }

    .stopped-headline {
      font-size: 1.5rem;
      font-weight: 600;
      color: rgba(245,245,248,0.85);
      line-height: 1.4;
    }

    .stopped-wordmark {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(245,245,248,0.92);
    }
    .stopped-wordmark span { color: #FAC775; }

    .stopped-tagline {
      font-size: 0.95rem;
      color: rgba(245,245,248,0.45);
      line-height: 1.9;
      font-style: italic;
      max-width: 300px;
    }

    /* ── Disconnected banner ──────────────────────────────────────── */
    #disconnected {
      position: fixed;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(180,30,30,0.18);
      border: 1px solid rgba(220,38,38,0.28);
      color: rgba(245,245,248,0.65);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      z-index: 50;
    }
    #disconnected.visible { opacity: 1; }

  </style>
</head>
<body>

  <!-- ── GPS overlay (blocks until fix acquired) ──────────────────────── -->
  <div id="gps-overlay">
    <div class="gps-spinner"></div>
    <div class="gps-status" id="gps-status">Acquiring GPS… go outside if indoors.</div>
  </div>

  <!-- ── Gradient background ───────────────────────────────────────────── -->
  <div id="bg"></div>

  <!-- ── Content ───────────────────────────────────────────────────────── -->
  <div id="content">
    <div class="wordmark" id="wordmark">Lumi<span>Nation</span></div>
    <div class="sub-text" id="sub-text">the corridor follows you</div>
  </div>

  <!-- ── Lamp count ────────────────────────────────────────────────────── -->
  <div id="lamp-count"></div>

  <!-- ── Stopped messages ──────────────────────────────────────────────── -->
  <div id="msg1">
    <div class="stopped-headline">The corridor followed you.</div>
  </div>
  <div id="msg2">
    <div class="stopped-wordmark">Lumi<span>Nation</span></div>
    <div class="stopped-tagline">
      "We are not turning the lights off.<br>
       We are turning them on intelligently."
    </div>
  </div>

  <!-- ── Debug panel (tap top-left 3× to toggle) ──────────────────────── -->
  <div id="debug" style="
    display:none; position:fixed; top:0; left:0; right:0;
    background:rgba(0,0,0,0.82); color:#FAC775;
    font:12px/1.7 monospace; padding:12px 16px;
    z-index:999; white-space:pre;
  "></div>

  <!-- ── Banners ───────────────────────────────────────────────────────── -->
  <div id="disconnected">Connection lost — reconnecting…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── GPS ───────────────────────────────────────────────────────────────
    let myLat    = null
    let myLng    = null
    let connected = false

    const gpsOverlay  = document.getElementById('gps-overlay')
    const gpsStatusEl = document.getElementById('gps-status')

    function onGpsSuccess(pos) {
      myLat = pos.coords.latitude
      myLng = pos.coords.longitude
      if (!connected) {
        connected = true
        gpsOverlay.classList.add('gone')
        connectSocket()
      }
    }

    function onGpsError() {
      gpsStatusEl.textContent = 'GPS unavailable. Make sure location is enabled and try outdoors.'
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000,
      })
    } else {
      gpsStatusEl.textContent = 'GPS not supported on this device.'
    }

    // ── WakeLock ──────────────────────────────────────────────────────────
    let wakeLock = null

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen')
          wakeLock.addEventListener('release', () => { wakeLock = null })
        }
      } catch (_) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock()
    })
    document.addEventListener('touchstart', () => {
      if (!wakeLock) requestWakeLock()
    }, { once: true })

    // ── Haversine ─────────────────────────────────────────────────────────
    function haversineMeters(lat1, lng1, lat2, lng2) {
      const R  = 6371000
      const φ1 = lat1 * Math.PI / 180
      const φ2 = lat2 * Math.PI / 180
      const Δφ = (lat2 - lat1) * Math.PI / 180
      const Δλ = (lng2 - lng1) * Math.PI / 180
      const a  = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
    }

    // ── Bearing difference (am I ahead or behind the host?) ───────────────
    function bearingDiff(hostLat, hostLng, hostHeading, myLat, myLng) {
      const y = Math.sin((myLng - hostLng) * Math.PI/180) * Math.cos(myLat * Math.PI/180)
      const x = Math.cos(hostLat * Math.PI/180) * Math.sin(myLat * Math.PI/180)
              - Math.sin(hostLat * Math.PI/180) * Math.cos(myLat * Math.PI/180)
              * Math.cos((myLng - hostLng) * Math.PI/180)
      const bearingToMe = Math.atan2(y, x) * 180 / Math.PI
      let diff = bearingToMe - hostHeading
      while (diff >  180) diff -= 360
      while (diff < -180) diff += 360
      return diff
    }

    const MIN_LOOKAHEAD  = 20   // metres — minimum corridor ahead regardless of speed
    const SAFETY_BEHIND  = 10   // metres — keep lit after walker passes
    const CORRIDOR_WIDTH = 30   // metres perpendicular — generous for GPS inaccuracy

    // ── Corridor state ────────────────────────────────────────────────────
    let hostLat       = null
    let hostLng       = null
    let hostVelocity  = 0
    let hostHeading   = 0
    let lookaheadSec  = 5.0
    let baselinePct   = 0.30
    let lastHostUpdate = 0   // timestamp of last corridor:update (for dead reckoning)

    // Brightness animation
    let currentBri    = 0.30
    let lastFrameTime = null
    let manualBri     = null

    // ── Debug panel (tap top-left corner 3× to toggle) ───────────────────
    const debugEl = document.getElementById('debug')
    let debugVisible = false
    let cornerTaps = 0, cornerTimer = null
    document.addEventListener('touchstart', (e) => {
      const t = e.touches[0]
      if (t.clientX > 80 || t.clientY > 80) return
      cornerTaps++
      clearTimeout(cornerTimer)
      cornerTimer = setTimeout(() => { cornerTaps = 0 }, 800)
      if (cornerTaps >= 3) {
        cornerTaps = 0
        debugVisible = !debugVisible
        debugEl.style.display = debugVisible ? 'block' : 'none'
      }
    })

    // ── Apply brightness to screen ────────────────────────────────────────
    const bgEl      = document.getElementById('bg')
    const bodyEl    = document.body
    const lampCntEl = document.getElementById('lamp-count')

    function applyBrightness(bri) {
      // t = 0 at baseline, 1 at fully lit
      const t = Math.max(0, Math.min(1, (bri - baselinePct) / Math.max(1 - baselinePct, 0.01)))

      // Solid background flood — entire screen changes colour
      const r = Math.round(7   + (255 - 7)   * t)
      const g = Math.round(7   + (200 - 7)   * t)
      const b = Math.round(12  + (80  - 12)  * t)
      bgEl.style.background = `rgb(${r},${g},${b})`

      // Hotspot overlay on top for depth (doesn't replace flood, adds to it)
      if (t > 0.05) {
        bgEl.style.backgroundImage = [
          `radial-gradient(ellipse 80% 60% at center, rgba(255,248,220,${(0.4*t).toFixed(3)}) 0%, transparent 70%)`,
        ].join(', ')
      } else {
        bgEl.style.backgroundImage = 'none'
      }

      // Switch text to dark when screen is bright
      bodyEl.classList.toggle('lit', t > 0.4)
    }

    // ── Animation loop ────────────────────────────────────────────────────
    function raf(ts) {
      if (lastFrameTime === null) lastFrameTime = ts
      const dt = Math.min((ts - lastFrameTime) / 1000, 0.1)  // cap at 100ms
      lastFrameTime = ts

      let target = baselinePct

      if (manualBri !== null) {
        target = manualBri
      } else if (myLat !== null && hostLat !== null) {
        const R = 6371000

        // ── Dead reckoning: extrapolate host position since last GPS update ──
        const age    = Math.min((performance.now() - lastHostUpdate) / 1000, 2.0)
        const hRad   = hostHeading * Math.PI / 180
        const exLat  = hostLat + age * hostVelocity * Math.cos(hRad) * (180 / Math.PI) / R
        const exLng  = hostLng + age * hostVelocity * Math.sin(hRad) * (180 / Math.PI) / (R * Math.cos(hostLat * Math.PI / 180))

        // ── Local coordinate frame (metres from extrapolated host) ──────────
        const dLat = (myLat - exLat) * Math.PI / 180 * R
        const dLng = (myLng - exLng) * Math.PI / 180 * R * Math.cos(exLat * Math.PI / 180)

        // Project onto heading: positive = lamp is AHEAD of walker
        const hx       = Math.sin(hRad)   // east component of heading
        const hy       = Math.cos(hRad)   // north component of heading
        const along    = dLat * hy + dLng * hx   // metres along path
        const perp     = Math.abs(dLat * hx - dLng * hy)  // metres off path

        const lookaheadDist = Math.max(hostVelocity * lookaheadSec, MIN_LOOKAHEAD)

        if (perp <= CORRIDOR_WIDTH) {
          if (along >= 0 && along <= lookaheadDist) {
            // AHEAD in corridor: fully lit, tiny falloff at far edge
            const t = 1 - (along / lookaheadDist) * 0.2  // 1.0→0.8 across corridor
            target = baselinePct + (1 - baselinePct) * t
          } else if (along < 0 && along >= -SAFETY_BEHIND) {
            // JUST PASSED: fade from full to baseline
            const t = 1 + (along / SAFETY_BEHIND)   // 1.0 at walker, 0.0 at edge
            target = baselinePct + (1 - baselinePct) * Math.max(0, t)
          }
        }
      }

      // Asymmetric easing: fast warm-up (τ=0.15s), slow dim-down (τ=0.5s)
      const τ    = target > currentBri ? 0.15 : 0.5
      const ease = 1 - Math.exp(-dt / τ)
      currentBri += (target - currentBri) * ease
      currentBri  = Math.max(0, Math.min(1, currentBri))

      applyBrightness(currentBri)

      if (debugVisible && myLat !== null && hostLat !== null) {
        const R      = 6371000
        const age    = Math.min((performance.now() - lastHostUpdate) / 1000, 2.0)
        const hRad   = hostHeading * Math.PI / 180
        const exLat  = hostLat + age * hostVelocity * Math.cos(hRad) * (180/Math.PI) / R
        const exLng  = hostLng + age * hostVelocity * Math.sin(hRad) * (180/Math.PI) / (R * Math.cos(hostLat*Math.PI/180))
        const dLat   = (myLat - exLat) * Math.PI/180 * R
        const dLng   = (myLng - exLng) * Math.PI/180 * R * Math.cos(exLat*Math.PI/180)
        const hx = Math.sin(hRad), hy = Math.cos(hRad)
        const along  = (dLat * hy + dLng * hx).toFixed(1)
        const perp   = Math.abs(dLat * hx - dLng * hy).toFixed(1)
        const lookaheadDist = Math.max(hostVelocity * lookaheadSec, MIN_LOOKAHEAD).toFixed(0)
        debugEl.textContent =
          `my GPS    : ${myLat.toFixed(5)}, ${myLng.toFixed(5)}\n` +
          `host GPS  : ${hostLat.toFixed(5)}, ${hostLng.toFixed(5)}\n` +
          `dead reckon age: ${age.toFixed(1)}s\n` +
          `along path: ${along}m  (+ = ahead)\n` +
          `perp dist : ${perp}m\n` +
          `host speed: ${hostVelocity.toFixed(1)} m/s\n` +
          `corridor  : ${lookaheadDist}m ahead / ${SAFETY_BEHIND}m behind\n` +
          `heading   : ${hostHeading.toFixed(0)}°\n` +
          `brightness: ${(currentBri * 100).toFixed(0)}%\n` +
          `manual    : ${manualBri !== null ? (manualBri*100).toFixed(0)+'%' : 'off'}`
      }

      requestAnimationFrame(raf)
    }

    // ── Socket.io ─────────────────────────────────────────────────────────
    let pingInterval = null

    function connectSocket() {
      requestWakeLock()

      const socket = io()

      socket.on('connect', () => {
        document.getElementById('disconnected').classList.remove('visible')
        socket.emit('lamp:join')

        // Start RAF loop
        if (lastFrameTime === null) requestAnimationFrame(raf)

        // GPS ping every 2s (presence + position)
        if (pingInterval) clearInterval(pingInterval)
        pingInterval = setInterval(() => {
          socket.emit('lamp:ping')
        }, 2000)
      })

      socket.on('disconnect', () => {
        document.getElementById('disconnected').classList.add('visible')
      })

      socket.on('corridor:update', (data) => {
        hostLat        = data.lat
        hostLng        = data.lng
        hostVelocity   = Math.max(0, data.velocity || 0)
        hostHeading    = data.heading || 0
        lookaheadSec   = data.lookaheadSec || 5.0
        baselinePct    = data.baselinePct  || 0.30
        lastHostUpdate = performance.now()
        manualBri      = (data.manualBri !== null && data.manualBri !== undefined)
                         ? data.manualBri : null
      })

      socket.on('session:state', ({ lampsConnected }) => {
        lampCntEl.textContent = lampsConnected > 0
          ? lampsConnected + (lampsConnected === 1 ? ' lamp connected' : ' lamps connected')
          : ''
      })

      socket.on('host:disconnected', () => {
        // Host walked away — graceful end sequence
        enterStopped()
      })
    }

    // ── Stopped sequence ──────────────────────────────────────────────────
    function enterStopped() {
      const msg1 = document.getElementById('msg1')
      const msg2 = document.getElementById('msg2')

      // Fade to near-dark
      currentBri = baselinePct
      applyBrightness(currentBri)
      document.getElementById('content').style.opacity = '0'
      lampCntEl.style.opacity = '0'

      setTimeout(() => {
        msg1.style.opacity = '1'
        setTimeout(() => {
          msg1.style.opacity = '0'
          setTimeout(() => { msg2.style.opacity = '1' }, 700)
        }, 3200)
      }, 600)
    }
  </script>
</body>
</html>
